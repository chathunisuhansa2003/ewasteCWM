<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Recycling Carbon Calculator</title>
    <link rel="stylesheet" href="carbon.css">
</head>
<body>

    <div class="calculator-container">
        <h2>Carbon Calculator</h2>
        <p class="subtitle">Estimate carbon prevented by recycling electronics</p>

        <div class="cards-grid" id="cardsGrid">
            <!-- Items will be dynamically generated by JavaScript -->
        </div>

        <button class="total-btn" onclick="calculateTotal()">Calculate Total</button>

        <div class="result-box">
            <h3>Total Carbon Prevented: <span id="totalCarbon">0.00</span> kg CO₂e</h3>
            <p><strong>Equivalencies:</strong></p>
            <ul>
                <li><span id="gasoline">0.00</span> liters of gasoline equivalent</li>
                <li><span id="cans">0.00</span> aluminum cans equivalent</li>
                <li><span id="trees">0.00</span> trees (annual uptake) equivalent</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
